<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Students</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px;
               margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1   { color: #2c3e50; border-bottom: 3px solid #27ae60; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse;
                background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th   { background: #2c3e50; color: white; padding: 12px 16px; text-align: left; }
        td   { padding: 12px 16px; border-bottom: 1px solid #ecf0f1; }
        tr:hover td { background: #f8f9fa; }
        a    { color: #2980b9; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge { background:#27ae60; color:white; padding:3px 10px;
                 border-radius:20px; font-size:13px; }
        .btn   { background:#27ae60; color:white; padding:8px 16px;
                 border-radius:5px; text-decoration:none; display:inline-block; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav style="margin-bottom:20px;">
        <a href="/">🏠 Home</a> |
        <a href="/students">Students</a> |
        <a class="btn" href="/students/add">➕ Add Student</a>
    </nav>

    <!-- Page header -->
    <h1>
        🎓 <span th:text="${pageTitle}">Students</span>
        <span class="badge" th:text="${totalCount} + ' enrolled'">0 enrolled</span>
    </h1>

    <!-- Search bar -->
    <form th:action="@{/students}" method="get" style="margin-bottom:20px; display:flex; gap:8px;">
        <input type="text" name="search" th:value="${param.search}"
               placeholder="Search by name..." style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;" />
        <button type="submit" style="background:#27ae60; color:white; padding:8px 16px; border:none; border-radius:4px; cursor:pointer;">Search</button>
        <a th:href="@{/students}" style="background:#95a5a6; color:white; padding:8px 16px; border-radius:4px; text-decoration:none; line-height:2;">Clear</a>
    </form>

    <!-- Empty state -->
    <p th:if="${students.isEmpty() and param.search == null}" style="color:#e67e22; font-style:italic;">
        No students are registered yet.
        <a href="/students/add">Add the first one →</a>
    </p>
    <p th:if="${students.isEmpty() and param.search != null}" style="color:#e67e22; font-style:italic;">
        No students found matching "<span th:text="${param.search}"></span>".
    </p>

    <!-- Student table -->
    <table th:if="${!students.isEmpty()}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Email</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}">1</td>
                <td th:text="${student.name}">Name</td>
                <td th:text="${student.course}">Course</td>
                <td th:text="${student.email}">email@example.com</td>
                <td>
                    <span th:text="${student.grade}"
                          style="font-weight:bold;">A</span>
                </td>
                <td>
                    <!-- th:href builds a dynamic URL with the student's ID -->
                    <!-- @{/students/{id}(id=${student.id})} -->
                    <!-- If student.id = 3 → href="/students/3"            -->
                    <a th:href="@{/students/{id}(id=${student.id})}">View →</a> |
                    <a th:href="@{/students/edit/{id}(id=${student.id})}">Edit</a> |
                    <a th:href="@{/students/delete/{id}(id=${student.id})}"
                       onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
