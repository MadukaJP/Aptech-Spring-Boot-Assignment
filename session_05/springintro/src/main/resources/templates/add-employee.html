<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee — Aptech Corp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
        }
        .container { width: 100%; max-width: 560px; }
        h1 { color: #2c3e50; margin-bottom: 24px; font-size: 24px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .error-summary {
            background: #fff5f5;
            border: 1.5px solid #fc8181;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 24px;
        }
        .error-summary strong { color: #c53030; display: block; margin-bottom: 6px; }
        .error-summary ul { color: #e53e3e; padding-left: 20px; }
        .error-summary li { margin: 3px 0; font-size: 13px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #4a5568; margin-bottom: 6px; font-size: 14px; }
        .required { color: #e53e3e; margin-left: 3px; }
        input[type="text"], input[type="email"], input[type="number"], select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            color: #2d3748;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
        }
        .input-error {
            border-color: #fc8181 !important;
            background: #fff5f5 !important;
        }
        .input-error:focus {
            box-shadow: 0 0 0 3px rgba(252,129,129,0.2) !important;
        }
        .field-error-msg {
            display: block;
            color: #c53030;
            font-size: 12px;
            margin-top: 5px;
            padding: 4px 10px;
            background: #fff5f5;
            border-left: 3px solid #fc8181;
            border-radius: 0 4px 4px 0;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-submit:hover  { opacity: 0.92; }
        .btn-submit:active { transform: scale(0.99); }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #718096; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #2d3748; }
    </style>
</head>
<body>
<div class="container">
    <h1>Add New Employee</h1>

    <div class="card">
        <form th:action="@{/employees/add}" th:object="${employee}" method="post">

            <div class="error-summary" th:if="${#fields.hasAnyErrors()}">
                <strong>Please correct the following errors:</strong>
                <ul>
                    <li th:each="err : ${#fields.allErrors()}" th:text="${err}">error</li>
                </ul>
            </div>

            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text"
                       th:field="*{fullName}"
                       th:class="${#fields.hasErrors('fullName')} ? 'input-error' : ''"
                       placeholder="e.g. John Doe">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}">name error</span>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="text"
                       th:field="*{email}"
                       th:class="${#fields.hasErrors('email')} ? 'input-error' : ''"
                       placeholder="e.g. john@aptech.com">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">email error</span>
            </div>

            <div class="form-group">
                <label>Department <span class="required">*</span></label>
                <select th:field="*{department}"
                        th:class="${#fields.hasErrors('department')} ? 'input-error' : ''">
                    <option value="">-- Select Department --</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Operations">Operations</option>
                </select>
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('department')}"
                      th:errors="*{department}">department error</span>
            </div>

            <div class="form-group">
                <label>Salary <span class="required">*</span></label>
                <input type="text"
                       th:field="*{salary}"
                       th:class="${#fields.hasErrors('salary')} ? 'input-error' : ''"
                       placeholder="e.g. 75000">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('salary')}"
                      th:errors="*{salary}">salary error</span>
            </div>

            <div class="form-group">
                <label>Join Date <span class="required">*</span></label>
                <input type="date"
                       th:field="*{joinDate}"
                       th:class="${#fields.hasErrors('joinDate')} ? 'input-error' : ''">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('joinDate')}"
                      th:errors="*{joinDate}">join date error</span>
            </div>

            <button type="submit" class="btn-submit">Add Employee</button>
        </form>
    </div>

    <a href="/employees" class="back-link">← Back to Employee List</a>
</div>
</body>
</html>
