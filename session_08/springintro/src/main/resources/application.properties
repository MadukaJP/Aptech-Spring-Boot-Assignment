spring.application.name=springintro

server.port=${PORT:5000}


spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spring_aptech_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:dev1234$}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP — Spring Boot's default)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
# Keep pool small on free Railway tier (limited CPU/memory)

# ── JPA / HIBERNATE ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# 'update' is fine for development.
# In production you would use 'validate' or run migration scripts (Flyway/Liquibase)

spring.jpa.show-sql=false
# false on cloud — you don't want to fill up Railway's log viewer with SQL statements




# ── ACTUATOR (Cloud Health Monitoring) ──────────────────────
# Expose only health and info endpoints publicly (not metrics, env, etc.)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# show-details=always → Railway sees the DB health status too:
# {"status":"UP","components":{"db":{"status":"UP"}}}

# Custom info that appears at /actuator/info
info.app.name=Aptech Student Portal
info.app.description=A full-stack Spring MVC application with JPA and Security
info.app.version=1.0.0
info.app.author=Maduka Johnpeter