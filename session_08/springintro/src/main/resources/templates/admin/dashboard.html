<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — Aptech Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        nav {
            background: linear-gradient(135deg, #1a365d, #2b6cb0);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .nav-brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-links a {
            color: #e2e8f0; text-decoration: none; padding: 8px 16px;
            border-radius: 6px; font-size: 14px; font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.12); color: white; }
        .nav-links a.active { background: rgba(255,255,255,0.18); color: white; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .nav-right span { font-size: 14px; color: #e2e8f0; }
        .nav-right strong { color: white; }
        .btn-logout {
            background: #e53e3e; color: white; border: none;
            padding: 7px 14px; border-radius: 6px; cursor: pointer;
            font-size: 13px; font-weight: 500; transition: background 0.2s;
        }
        .btn-logout:hover { background: #c53030; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 24px; }
        h1 { font-size: 24px; color: #2d3748; margin-bottom: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card {
            background: white; border-radius: 10px; padding: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center;
        }
        .stat-card .number { font-size: 36px; font-weight: 700; color: #2b6cb0; }
        .stat-card .label { font-size: 14px; color: #718096; margin-top: 4px; }
        .admin-links { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .admin-links h2 { font-size: 18px; color: #2d3748; margin-bottom: 16px; }
        .admin-links a {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; border-radius: 8px; text-decoration: none;
            color: #4a5568; font-size: 15px; transition: background 0.15s;
        }
        .admin-links a:hover { background: #f7fafc; color: #2b6cb0; }
        .admin-links a + a { margin-top: 4px; }
        .current-user { color: #718096; margin-bottom: 24px; font-size: 14px; }
        .current-user strong { color: #2d3748; }
    </style>
</head>
<body>

<nav>
    <div class="nav-brand">🎓 Aptech Portal</div>
    <div class="nav-links">
        <a th:href="@{/students}">Students</a>
        <a th:href="@{/courses}">Courses</a>
        <a th:href="@{/admin/dashboard}" class="active">Admin</a>
    </div>
    <div class="nav-right">
        <span>👤 <strong sec:authentication="name"></strong></span>
        <form method="post" th:action="@{/logout}" style="margin:0;">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <h1>🛡️ Admin Dashboard</h1>
    <p class="current-user">Logged in as: <strong th:text="${currentUser}"></strong></p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="number" th:text="${totalStudents}">0</div>
            <div class="label">Total Students</div>
        </div>
    </div>

    <div class="admin-links">
        <h2>Quick Actions</h2>
        <a th:href="@{/students}">📋 Manage Students</a>
        <a th:href="@{/students/add}">➕ Add Student</a>
        <a th:href="@{/courses}">📚 View Courses</a>
    </div>
</div>

</body>
</html>
