<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Add Student — Aptech Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        nav {
            background: linear-gradient(135deg, #1a365d, #2b6cb0);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .nav-brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-links a {
            color: #e2e8f0; text-decoration: none; padding: 8px 16px;
            border-radius: 6px; font-size: 14px; font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.12); color: white; }
        .nav-links a.active { background: rgba(255,255,255,0.18); color: white; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .nav-right span { font-size: 14px; color: #e2e8f0; }
        .nav-right strong { color: white; }
        .btn-logout {
            background: #e53e3e; color: white; border: none;
            padding: 7px 14px; border-radius: 6px; cursor: pointer;
            font-size: 13px; font-weight: 500; transition: background 0.2s;
        }
        .btn-logout:hover { background: #c53030; }
        .container { width: 100%; max-width: 560px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; margin-bottom: 24px; font-size: 24px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .error-summary {
            background: #fff5f5;
            border: 1.5px solid #fc8181;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 24px;
        }
        .error-summary strong { color: #c53030; display: block; margin-bottom: 6px; }
        .error-summary ul { color: #e53e3e; padding-left: 20px; }
        .error-summary li { margin: 3px 0; font-size: 13px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #4a5568; margin-bottom: 6px; font-size: 14px; }
        .required { color: #e53e3e; margin-left: 3px; }
        input[type="text"], input[type="email"], select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            color: #2d3748;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #48bb78;
            box-shadow: 0 0 0 3px rgba(72,187,120,0.15);
        }
        .input-error {
            border-color: #fc8181 !important;
            background: #fff5f5 !important;
        }
        .input-error:focus {
            box-shadow: 0 0 0 3px rgba(252,129,129,0.2) !important;
        }
        .field-error-msg {
            display: block;
            color: #c53030;
            font-size: 12px;
            margin-top: 5px;
            padding: 4px 10px;
            background: #fff5f5;
            border-left: 3px solid #fc8181;
            border-radius: 0 4px 4px 0;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #38a169, #2f855a);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(56,161,105,0.3);
        }
        .btn-submit:active { transform: scale(0.99); }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #718096; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #2d3748; }
    </style>
</head>
<body>

<nav>
    <div class="nav-brand">🎓 Aptech Portal</div>
    <div class="nav-links">
        <a th:href="@{/students}">Students</a>
        <a th:href="@{/courses}">Courses</a>
        <a th:href="@{/admin/dashboard}"
           sec:authorize="hasRole('ADMIN')">Admin</a>
    </div>
    <div class="nav-right">
        <span>👤 <strong sec:authentication="name"></strong></span>
        <form method="post" th:action="@{/logout}" style="margin:0;">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <h1>➕ Enrol New Student</h1>
    <div class="card">
        <form th:action="@{/students/add}" th:object="${student}" method="post">
            <div class="error-summary" th:if="${#fields.hasAnyErrors()}">
                <strong>⚠️ Please correct the following errors:</strong>
                <ul>
                    <li th:each="err : ${#fields.allErrors()}" th:text="${err}">error</li>
                </ul>
            </div>
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" th:field="*{name}"
                       th:class="${#fields.hasErrors('name')} ? 'input-error' : ''"
                       placeholder="e.g. Alice Johnson">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}">name error</span>
            </div>
            <div class="form-group">
                <label>Course <span class="required">*</span></label>
                <input type="text" th:field="*{course}"
                       th:class="${#fields.hasErrors('course')} ? 'input-error' : ''"
                       placeholder="e.g. Spring MVC">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('course')}"
                      th:errors="*{course}">course error</span>
            </div>
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="text" th:field="*{email}"
                       th:class="${#fields.hasErrors('email')} ? 'input-error' : ''"
                       placeholder="e.g. alice@school.com">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">email error</span>
            </div>
            <div class="form-group">
                <label>Phone Number <span class="required">*</span></label>
                <input type="text" th:field="*{phone}"
                       th:class="${#fields.hasErrors('phone')} ? 'input-error' : ''"
                       placeholder="e.g. 08012345678">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}">phone error</span>
            </div>
            <div class="form-group">
                <label>Registration Number <span class="required">*</span></label>
                <input type="text" th:field="*{regNumber}"
                       th:class="${#fields.hasErrors('regNumber')} ? 'input-error' : ''"
                       placeholder="e.g. APT-2024-0001">
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('regNumber')}"
                      th:errors="*{regNumber}">reg number error</span>
            </div>
            <div class="form-group">
                <label>Grade <span class="required">*</span></label>
                <select th:field="*{grade}"
                        th:class="${#fields.hasErrors('grade')} ? 'input-error' : ''">
                    <option value="">-- Select Grade --</option>
                    <option value="A">A — Excellent</option>
                    <option value="B">B — Good</option>
                    <option value="C">C — Average</option>
                    <option value="D">D — Below Average</option>
                    <option value="F">F — Fail</option>
                </select>
                <span class="field-error-msg"
                      th:if="${#fields.hasErrors('grade')}"
                      th:errors="*{grade}">grade error</span>
            </div>
            <button type="submit" class="btn-submit">Enrol Student</button>
        </form>
    </div>
    <a href="/students" class="back-link">← Back to Student List</a>
</div>
</body>
</html>
