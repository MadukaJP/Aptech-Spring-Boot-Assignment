<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Students — Aptech Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        nav {
            background: linear-gradient(135deg, #1a365d, #2b6cb0);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .nav-brand {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.12); color: white; }
        .nav-links a.active { background: rgba(255,255,255,0.18); color: white; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .nav-right span { font-size: 14px; color: #e2e8f0; }
        .nav-right strong { color: white; }
        .btn-logout {
            background: #e53e3e; color: white; border: none;
            padding: 7px 14px; border-radius: 6px; cursor: pointer;
            font-size: 13px; font-weight: 500;
            transition: background 0.2s;
        }
        .btn-logout:hover { background: #c53030; }
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .page-header h1 { font-size: 24px; color: #2d3748; }
        .btn-add {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white; padding: 10px 20px; border-radius: 8px;
            text-decoration: none; font-size: 14px; font-weight: 500;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-add:hover {
            background: linear-gradient(135deg, #38a169, #2f855a);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(56,161,105,0.3);
        }
        .btn-add:active { transform: translateY(0); }
        table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            background: white; border-radius: 10px; overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        thead { background: #2d3748; }
        th {
            color: white; padding: 14px 16px; text-align: left;
            font-size: 13px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 16px; font-size: 14px; color: #4a5568;
            border-bottom: 1px solid #edf2f7;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: #f7fafc; }
        .grade-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
        }
        .grade-a { background: #f0fff4; color: #276749; }
        .grade-b { background: #ebf8ff; color: #2b6cb0; }
        .grade-c { background: #fffbeb; color: #975a16; }
        .grade-d { background: #fff5f5; color: #9b2c2c; }
        .grade-f { background: #fed7d7; color: #c53030; }
        .action-group { display: flex; gap: 8px; align-items: center; }
        .btn-edit {
            background: #edf2f7; color: #4a5568; padding: 6px 14px;
            border-radius: 6px; text-decoration: none; font-size: 13px;
            font-weight: 500; transition: all 0.2s;
        }
        .btn-edit:hover { background: #e2e8f0; color: #2d3748; }
        .btn-delete {
            background: #fff5f5; color: #e53e3e; padding: 6px 14px;
            border-radius: 6px; text-decoration: none; font-size: 13px;
            font-weight: 500; transition: all 0.2s;
        }
        .btn-delete:hover { background: #fed7d7; color: #c53030; }
        .empty-state { text-align: center; padding: 48px; color: #a0aec0; }
    </style>
</head>
<body>

<nav>
    <div class="nav-brand">🎓 Aptech Portal</div>
    <div class="nav-links">
        <a th:href="@{/students}" class="active">Students</a>
        <a th:href="@{/courses}">Courses</a>
        <a th:href="@{/admin/dashboard}"
           sec:authorize="hasRole('ADMIN')">Admin</a>
    </div>
    <div class="nav-right">
        <span>👤 <strong sec:authentication="name"></strong></span>
        <form method="post" th:action="@{/logout}" style="margin:0;">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1>📋 Student List (<span th:text="${totalCount}">0</span>)</h1>
        <a th:href="@{/students/add}"
           sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')"
           class="btn-add">➕ Add New Student</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Course</th><th>Grade</th>
                <th sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td><strong th:text="${student.name}"></strong></td>
                <td th:text="${student.course}"></td>
                <td>
                    <span class="grade-badge"
                          th:classappend="'grade-' + ${#strings.toLowerCase(student.grade)}"
                          th:text="${student.grade}"></span>
                </td>
                <td sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')">
                    <div class="action-group">
                        <a th:href="@{/students/edit/{id}(id=${student.id})}"
                           sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')"
                           class="btn-edit">Edit</a>
                        <a th:href="@{/students/delete/{id}(id=${student.id})}"
                           sec:authorize="hasRole('ADMIN')"
                           onclick="return confirm('Are you sure you want to delete this student?')"
                           class="btn-delete">Delete</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
