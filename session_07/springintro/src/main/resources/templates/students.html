<!DOCTYPE html>
<!-- IMPORTANT: Must add xmlns:sec namespace for sec: attributes -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title sec:authentication="name">Welcome — Aptech Portal</title>
</head>
<body>

<!-- ── NAVIGATION BAR ──────────────────────────────────── -->
<nav style="background:#2d3748; padding:12px 24px; display:flex;
            justify-content:space-between; align-items:center; color:white;">
    <span>🎓 Aptech Portal</span>
    <div style="display:flex; align-items:center; gap:20px;">
        <!-- sec:authentication="name" shows the logged-in username -->
        <span>👤 <strong sec:authentication="name"></strong></span>

        <!-- sec:authorize="hasRole('...')" shows/hides based on role -->
        <!-- This link is ONLY visible to ADMINs -->
        <a th:href="@{/admin/dashboard}"
           sec:authorize="hasRole('ADMIN')"
           style="color:#90cdf4;">🛡️ Admin Panel</a>

        <!-- Logout — must use POST method (CSRF protection) -->
        <form method="post" th:action="@{/logout}" style="margin:0;">
            <button type="submit"
                    style="background:#e53e3e; color:white; border:none;
                           padding:8px 14px; border-radius:6px; cursor:pointer;">
                🚪 Logout
            </button>
        </form>
    </div>
</nav>

<!-- ── PAGE CONTENT ─────────────────────────────────────── -->
<div style="padding:24px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>📋 Student List (<span th:text="${totalCount}">0</span>)</h1>

        <!-- Add Student — visible ONLY to INSTRUCTOR and ADMIN -->
        <a th:href="@{/students/add}"
           sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')"
           style="background:#48bb78; color:white; padding:10px 20px;
                  border-radius:8px; text-decoration:none;">
            ➕ Add New Student
        </a>
    </div>

    <table border="1" cellpadding="8" style="width:100%; border-collapse:collapse;">
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Course</th><th>Grade</th>
                <!-- Only show Actions column if user has at least INSTRUCTOR role -->
                <th sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.course}"></td>
                <td th:text="${student.grade}"></td>

                <td sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')">
                    <!-- Edit: visible to INSTRUCTOR and ADMIN -->
                    <a th:href="@{/students/edit/{id}(id=${student.id})}"
                       sec:authorize="hasAnyRole('INSTRUCTOR', 'ADMIN')">✏️ Edit</a>

                    <!-- Delete: visible ONLY to ADMIN -->
                    <a th:href="@{/students/delete/{id}(id=${student.id})}"
                       sec:authorize="hasRole('ADMIN')"
                       onclick="return confirm('Are you sure you want to delete this student?')"
                       style="color:#e53e3e; margin-left:8px;">🗑️ Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
